services:
  db:
    restart: unless-stopped

  web:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:${APP_PORT:-3017}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s