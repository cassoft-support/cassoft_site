name: cassoft

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cassoft}
      POSTGRES_USER: ${POSTGRES_USER:-cassoft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cassoft_local_password}
    volumes:
      - cassoft_postgres:/var/lib/postgresql/data
      - ./server/database/migrations/0001_publications.sql:/docker-entrypoint-initdb.d/001_publications.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cassoft} -d ${POSTGRES_DB:-cassoft}"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
      NUXT_DATABASE_URL: postgres://${POSTGRES_USER:-cassoft}:${POSTGRES_PASSWORD:-cassoft_local_password}@db:5432/${POSTGRES_DB:-cassoft}
      DATABASE_URL: postgres://${POSTGRES_USER:-cassoft}:${POSTGRES_PASSWORD:-cassoft_local_password}@db:5432/${POSTGRES_DB:-cassoft}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  cassoft_postgres: